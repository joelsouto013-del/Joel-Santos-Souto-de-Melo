<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --primaria:#0f4c45;--secundaria:#d9e8e2;--fundo:#f2f5f3;--texto:#10211f;--destaque:#ffb703;--fonte:system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:auto}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:var(--fonte);line-height:1.6;font-size:1.0625rem}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--destaque);outline-offset:3px}
.wrap{width:min(1100px,100% - 2.5rem);margin-inline:auto}
section{padding:4rem 0}
h1,h2,h3{line-height:1.15;margin:0 0 .75rem;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,6vw,4rem);max-width:16ch}
h2{font-size:clamp(1.6rem,3.6vw,2.4rem)}
p{margin:0 0 1rem;max-width:62ch}
.btn{display:inline-block;background:var(--destaque);color:var(--texto);font-weight:700;text-decoration:none;padding:.9rem 1.6rem;border-radius:.5rem;border:2px solid var(--texto)}
.btn:hover{background:var(--texto);color:var(--fundo)}
header.top{padding:1.1rem 0}
header.top .wrap{display:flex;align-items:center;gap:.6rem;font-weight:800}
.hero{background:var(--primaria);color:var(--fundo);padding:4rem 0}
.hero .wrap{display:grid;gap:2.5rem;align-items:center}
.hero img{border-radius:1rem;width:100%;aspect-ratio:4/3;object-fit:cover}
.grid{display:grid;gap:1.5rem}
.item{border-top:4px solid var(--primaria);padding-top:1rem}
.item .ic{font-size:2rem}
.prova{background:var(--secundaria)}
.dep{display:flex;gap:1rem;align-items:flex-start}
.dep img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
.dep blockquote{margin:0 0 .4rem}
.cta{background:var(--primaria);color:var(--fundo);text-align:center}
.cta p{margin-inline:auto}
footer{padding:2rem 0;font-size:.95rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between}
footer nav{display:flex;gap:1rem;flex-wrap:wrap}
@media(min-width:768px){
  .hero .wrap{grid-template-columns:1.1fr 1fr}
  .grid.b{grid-template-columns:repeat(3,1fr)}
  .grid.d{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:no-preference){.btn{transition:background .15s,color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   CONFIGURAÇÃO — edite SOMENTE este bloco para personalizar.
   Nada abaixo dele precisa ser alterado.
   ============================================================ */
const CONFIG = {
  // Identidade
  marca: {
    nome: "Forno Lento",            // nome exibido no topo e no rodapé
    slogan: "Pão de fermentação natural",
    favicon: "🍞"                   // um emoji
  },

  // Cores (qualquer valor CSS: #hex, rgb(), hsl())
  cores: {
    primaria: "#0f4c45",    // fundo do topo da página e da chamada final
    secundaria: "#d9e8e2",  // fundo da seção de depoimentos
    fundo: "#f2f5f3",       // fundo geral
    texto: "#10211f",       // cor do texto
    destaque: "#ffb703"     // botões e foco do teclado
  },

  // Fonte (inclua alternativas do sistema no final)
  fonte: "'Trebuchet MS', 'Segoe UI', system-ui, sans-serif",

  // Seção principal
  hero: {
    titulo: "Pão de verdade, assado devagar",
    subtitulo: "Massa fermentada por 24 horas, sem aditivos. Saída do forno todos os dias às 7h.",
    botaoTexto: "Encomendar pelo WhatsApp",
    botaoLink: "https://wa.me/5500000000000",
    imagem: "",            // URL da imagem; vazio = usa ilustração padrão
    imagemAlt: "Pães recém-assados sobre uma tábua"
  },

  // Benefícios (de 3 a 6 itens)
  beneficios: {
    titulo: "Por que o nosso pão é diferente",
    itens: [
      { icone: "🌾", titulo: "Farinha selecionada", descricao: "Trigo de moinhos pequenos, sem conservantes." },
      { icone: "⏱️", titulo: "24 horas de fermentação", descricao: "Mais sabor, casca crocante e fácil de digerir." },
      { icone: "🚲", titulo: "Entrega no mesmo dia", descricao: "Pedidos feitos até as 10h chegam ainda quentes." }
    ]
  },

  // Depoimentos
  prova: {
    titulo: "O que dizem nossos clientes",
    itens: [
      { nome: "Marina Alves", cargo: "Cliente desde 2022", texto: "O melhor pão de fermentação natural que já comi. Não troco mais.", foto: "" },
      { nome: "Carlos Mendes", cargo: "Chef de cozinha", texto: "Uso o pão da casa no meu restaurante. Os clientes perguntam onde comprar.", foto: "" }
    ]
  },

  // Chamada final
  cta: {
    titulo: "Seu pão de amanhã já está fermentando",
    texto: "Faça seu pedido hoje e receba na manhã seguinte.",
    botaoTexto: "Fazer meu pedido",
    botaoLink: "https://wa.me/5500000000000"
  },

  // Rodapé
  rodape: {
    texto: "© 2026 Forno Lento. Todos os direitos reservados.",
    links: [
      { texto: "Instagram", url: "https://instagram.com" },
      { texto: "Contato", url: "mailto:contato@exemplo.com" }
    ]
  },

  // Liga (true) ou desliga (false) cada seção
  secoes: { hero: true, beneficios: true, prova: true, cta: true, rodape: true }
};
/* ============================ FIM DA CONFIGURAÇÃO ============================ */

(function () {
  const C = CONFIG;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Placeholder em SVG (funciona offline)
  const ph = (w, h) => "data:image/svg+xml;utf8," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}'><rect width='100%' height='100%' fill='#c9d9d3'/><circle cx='${w / 2}' cy='${h / 2}' r='${Math.min(w, h) / 5}' fill='#9fb9b0'/></svg>`);
  const img = (src, alt, w, h) => `<img src="${esc(src || ph(w, h))}" alt="${esc(alt)}" width="${w}" height="${h}" loading="lazy" onerror="this.onerror=null;this.src='${ph(w, h)}'">`;

  // Tema: aplica cores e fonte como variáveis CSS
  const r = document.documentElement.style;
  Object.entries(C.cores).forEach(([k, v]) => r.setProperty("--" + k, v));
  r.setProperty("--fonte", C.fonte);
  document.title = `${C.marca.nome} — ${C.marca.slogan}`;
  const fav = document.createElement("link");
  fav.rel = "icon";
  fav.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>" + encodeURIComponent(C.marca.favicon) + "</text></svg>";
  document.head.appendChild(fav);

  const S = C.secoes;
  const render = {
    topo: () => `<header class="top"><div class="wrap"><span aria-hidden="true">${esc(C.marca.favicon)}</span>${esc(C.marca.nome)}</div></header>`,
    hero: () => `<section class="hero"><div class="wrap"><div>
        <h1>${esc(C.hero.titulo)}</h1><p>${esc(C.hero.subtitulo)}</p>
        <a class="btn" href="${esc(C.hero.botaoLink)}">${esc(C.hero.botaoTexto)}</a></div>
        ${img(C.hero.imagem, C.hero.imagemAlt, 800, 600)}</div></section>`,
    beneficios: () => `<section><div class="wrap"><h2>${esc(C.beneficios.titulo)}</h2>
        <div class="grid b">${C.beneficios.itens.map(i => `<div class="item"><div class="ic" aria-hidden="true">${esc(i.icone)}</div><h3>${esc(i.titulo)}</h3><p>${esc(i.descricao)}</p></div>`).join("")}</div></div></section>`,
    prova: () => `<section class="prova"><div class="wrap"><h2>${esc(C.prova.titulo)}</h2>
        <div class="grid d">${C.prova.itens.map(d => `<figure class="dep" style="margin:0">${img(d.foto, d.nome, 112, 112)}<div><blockquote>${esc(d.texto)}</blockquote><figcaption><strong>${esc(d.nome)}</strong><br>${esc(d.cargo)}</figcaption></div></figure>`).join("")}</div></div></section>`,
    cta: () => `<section class="cta"><div class="wrap"><h2>${esc(C.cta.titulo)}</h2><p>${esc(C.cta.texto)}</p>
        <a class="btn" href="${esc(C.cta.botaoLink)}">${esc(C.cta.botaoTexto)}</a></div></section>`,
    rodape: () => `<footer><div class="wrap"><span>${esc(C.rodape.texto)}</span><nav aria-label="Links do rodapé">${C.rodape.links.map(l => `<a href="${esc(l.url)}">${esc(l.texto)}</a>`).join("")}</nav></div></footer>`
  };

  document.getElementById("app").innerHTML =
    render.topo() + "<main>" + ["hero", "beneficios", "prova", "cta"].filter(k => S[k]).map(k => render[k]()).join("") + "</main>" + (S.rodape ? render.rodape() : "");
})();
</script>
</body>
</html>
